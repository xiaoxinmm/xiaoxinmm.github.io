baseURL = "https://xiaoxinmm.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "Russell's Tech Blog"
theme = "PaperMod"


[params]
  defaultTheme = "dark"
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showToc = true
  TocOpen = false
  description = "技术博客 — 记录开发、运维与折腾的日常"
  author = "Russell Lee"
  DateFormat = "2006-01-02"

  [params.homeInfoParams]
    Title = "👋 Hey, I'm Russell"
    Content = "全栈工程师 / 开源爱好者 / 折腾不止"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xiaoxinmm"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 5

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 10

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 15

[pagination]
  pagerSize = 10
